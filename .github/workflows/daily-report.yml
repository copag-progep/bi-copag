name: Relatório diário AnalyticSEI — e-mail

# Envia todo dia útil às 20:07 BRT (23:07 UTC) um e-mail HTML compacto com
# os principais indicadores do dia: ativos, entradas/saídas, fluxo por setor
# e alertas de processos críticos.
# Pode ser disparado manualmente a qualquer momento via "Run workflow".
# Horário definido após o upload principal (19:17) e sua recuperação (19:47).
# O envio só continua se o workflow daily-upload.yml tiver concluído com sucesso
# no mesmo dia, considerando o horário America/Fortaleza.

on:
  schedule:
    - cron: "7 23 * * 1-5"   # 20:07 BRT (UTC-3) = 23:07 UTC, seg–sex
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar upload diário bem-sucedido
        id: upload_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPLOAD_WORKFLOW_FILE: daily-upload.yml
        run: python scripts/check_daily_upload_success.py

      - name: Ignorar relatório sem upload atualizado
        if: steps.upload_gate.outputs.upload_ok != 'true'
        run: |
          echo "Relatório diário não enviado."
          echo "Motivo: não existe upload diário bem-sucedido hoje antes deste relatório."

      - name: Instalar dependências
        if: steps.upload_gate.outputs.upload_ok == 'true'
        run: pip install httpx

      - name: Gerar e enviar relatório diário
        if: steps.upload_gate.outputs.upload_ok == 'true'
        env:
          BI_API_URL:         ${{ vars.BI_API_URL || 'https://bi-copag-api.onrender.com' }}
          BI_API_KEY:         ${{ secrets.BI_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENTS:  ${{ vars.REPORT_RECIPIENTS }}
        run: python scripts/daily_report.py

      - name: Notificar falha por e-mail
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: ${{ secrets.GMAIL_USER }}
          to: ${{ vars.REPORT_RECIPIENTS }}
          subject: "⚠️ AnalyticSEI — falha no relatório diário (${{ github.run_id }})"
          body: |
            O relatório diário do AnalyticSEI falhou.

            Logs completos: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
