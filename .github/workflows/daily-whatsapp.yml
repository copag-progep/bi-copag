name: Relatório diário WhatsApp — BI COPAG

# Dispara todo dia útil às 19:30 BRT (22:30 UTC), 30 min após o upload SEI.
# Pode ser disparado manualmente a qualquer momento via "Run workflow".
#
# Fase 0 (atual): WHATSAPP_TOKEN não está configurado → script roda em dry-run
# automaticamente e exibe a mensagem nos logs da Action.
#
# Para ativar o envio real:
#   1. Submeter template à Meta e aguardar aprovação
#   2. Descomentar WHATSAPP_TOKEN, WHATSAPP_PHONE_ID e WHATSAPP_RECIPIENTS abaixo
#   3. Completar o mapeamento de variáveis em send_whatsapp() no script
# O script detecta WHATSAPP_TOKEN e muda para modo produção sem alterar o comando.

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 19:30 BRT (UTC-3) = 22:30 UTC, seg–sex
  workflow_dispatch:

jobs:
  whatsapp-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install httpx

      - name: Gerar relatório diário
        env:
          BI_API_URL:  ${{ vars.BI_API_URL || 'https://bi-copag-api.onrender.com' }}
          BI_API_KEY:  ${{ secrets.BI_API_KEY }}
          # Quando o template Meta for aprovado, descomentar:
          # WHATSAPP_TOKEN:      ${{ secrets.WHATSAPP_TOKEN }}
          # WHATSAPP_PHONE_ID:   ${{ secrets.WHATSAPP_PHONE_ID }}
          # WHATSAPP_RECIPIENTS: ${{ vars.WHATSAPP_RECIPIENTS }}
        run: python scripts/whatsapp_report.py
