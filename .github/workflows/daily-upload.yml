name: Upload diário SEI → AnalyticSEI

# Roda automaticamente de segunda a sexta às 19:17 BRT (22:17 UTC).
# Às 19:47 BRT há uma recuperação: ela só executa o uploader quando ainda
# não existe upload bem-sucedido no dia.
# Pode ser disparado manualmente em qualquer momento via "Run workflow".
#
# Para trocar de coordenador:
#   Atualize apenas os Secrets SEI_USER e SEI_PASSWORD em:
#   github.com/copag-progep/bi-copag → Settings → Secrets and variables → Actions
#   Nenhum arquivo de código precisa ser alterado.

on:
  schedule:
    - cron: "17 22 * * 1-5"  # principal: 19:17 BRT (UTC-3), segunda a sexta
    - cron: "47 22 * * 1-5"  # recuperação: 19:47 BRT, somente se necessário
  workflow_dispatch:            # disparo manual (útil para testes e reprocessamentos)

permissions:
  actions: read
  contents: read

concurrency:
  group: analyticsei-daily-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60         # abort se demorar mais de 1h (ex: SEI fora do ar)

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar necessidade do upload de recuperação
        id: upload_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPLOAD_WORKFLOW_FILE: daily-upload.yml
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "47 22 * * 1-5" ]; then
            echo "Disparo de recuperação: verificando se o upload principal já teve sucesso."
            if ! python scripts/check_daily_upload_success.py; then
              echo "A verificação falhou; o upload será executado por segurança."
              echo "upload_ok=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "upload_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ignorar recuperação desnecessária
        if: steps.upload_gate.outputs.upload_ok == 'true'
        run: echo "Upload do dia já concluído com sucesso; recuperação dispensada."

      - name: Instalar dependências Python
        if: steps.upload_gate.outputs.upload_ok != 'true'
        run: pip install playwright httpx

      - name: Instalar Chromium (Playwright)
        if: steps.upload_gate.outputs.upload_ok != 'true'
        run: playwright install chromium --with-deps

      - name: Executar uploader SEI
        if: steps.upload_gate.outputs.upload_ok != 'true'
        env:
          SEI_URL:      ${{ secrets.SEI_URL }}
          SEI_USER:     ${{ secrets.SEI_USER }}      # atualizar na troca de coordenador
          SEI_PASSWORD: ${{ secrets.SEI_PASSWORD }}  # atualizar na troca de coordenador
          BI_API_URL:   ${{ vars.BI_API_URL || 'https://bi-copag-api.onrender.com' }}
          BI_API_KEY:   ${{ secrets.BI_API_KEY }}
          SEI_UPLOAD_ARTIFACT_DIR: artifacts/sei-upload
          SEI_UPLOAD_SETOR_RETRIES: "3"
        run: python scripts/sei_uploader.py

      - name: Publicar diagnóstico do SEI
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sei-upload-diagnostics-${{ github.run_id }}
          path: artifacts/sei-upload/
          if-no-files-found: ignore
          retention-days: 7

      - name: Notificar falha por e-mail
        if: failure() && (github.event_name != 'schedule' || github.event.schedule == '47 22 * * 1-5')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: ${{ secrets.GMAIL_USER }}
          to: ${{ vars.REPORT_RECIPIENTS }}
          subject: "⚠️ AnalyticSEI — falha no upload automático (${{ github.run_id }})"
          body: |
            O upload diário de processos SEI → AnalyticSEI falhou em ${{ github.event.repository.full_name }}.

            Data: ${{ github.event.schedule || 'disparo manual' }}
            Logs completos: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Diagnósticos: baixe o artifact sei-upload-diagnostics-${{ github.run_id }} na página da execução.

            Verifique se:
            - O SEI está acessível (sei.ufc.br)
            - As credenciais SEI_USER e SEI_PASSWORD estão corretas nos Secrets
            - A API do AnalyticSEI está respondendo (health check: ${{ vars.BI_API_URL || 'https://bi-copag-api.onrender.com' }}/api/health)
