name: Relatório semanal SEI Analytics

# Envia todo final de semana (sexta 20:00 BRT) um e-mail HTML com
# os principais indicadores da semana para os destinatários configurados.
# Pode ser disparado manualmente em qualquer momento.
# Horário definido após o upload diário (19:00 BRT) para garantir dados atualizados.

on:
  schedule:
    - cron: "0 23 * * 5"   # sexta-feira 20:00 BRT (UTC-3) = 23:00 UTC
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install httpx

      - name: Gerar e enviar relatório semanal
        env:
          BI_API_URL:         ${{ vars.BI_API_URL || 'https://bi-copag-api.onrender.com' }}
          BI_API_KEY:         ${{ secrets.BI_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}          # copag@progep.ufc.br
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENTS:  ${{ vars.REPORT_RECIPIENTS }}
        run: python scripts/weekly_report.py
