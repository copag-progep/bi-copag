name: Relatório semanal BI COPAG

# Envia todo final de semana (sexta 17:00 BRT) um e-mail HTML com
# os principais indicadores da semana para os destinatários configurados.
# Pode ser disparado manualmente em qualquer momento.

on:
  schedule:
    - cron: "0 20 * * 5"   # sexta-feira 17:00 BRT (UTC-3) = 20:00 UTC
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install httpx

      - name: Gerar e enviar relatório semanal
        env:
          BI_API_URL:         ${{ vars.BI_API_URL }}
          BI_API_KEY:         ${{ secrets.BI_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}          # copag@progep.ufc.br
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENTS:  ${{ vars.REPORT_RECIPIENTS }}
        run: python scripts/weekly_report.py
